# Keyless opt-in PTY composition for the headless stream-json snapshot.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@origin-ai/xhe-llm-deepseek'
        disabled: true
      - insert:
          - id: sandbox-policy
            name: '@origin-ai/xhe-sandbox-policy'
            config:
              mode: danger-full-access
          - id: pty
            name: '@origin-ai/xhe-terminal'
          - id: pty-snapshot-backend
            name: '../acp-agent/pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@origin-ai/xhe-tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@origin-ai/xhe-llm-replay'
